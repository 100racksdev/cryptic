<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0d">
    <title>OG5M | Resource Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/resources.css">
    <script src="/resources.js" defer></script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="OG5M home">
        <span class="brand-fx">OG</span>
        <span class="brand-name">5M <b>ARCHIVE</b></span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a class="nav-link is-active" href="#resources">Archive</a>
        <button class="nav-link" id="tickets-button" type="button">Tickets</button>
      </nav>
      <div class="account-area">
        <span class="online"><i></i> ONLINE</span>
        <button class="account-button" id="account-button" type="button">Login</button>
      </div>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow"><span>///</span> AUTHORIZED RESOURCE VAULT</p>
          <h1 id="page-title">OG5M<br><em>ARCHIVE</em></h1>
          <p class="hero-subtitle">Private releases. Clean files. Direct creator sources.</p>
        </div>
        <aside class="hero-status">
          <span>STATUS</span>
          <strong><i></i> SECURE</strong>
        </aside>
      </section>

      <section class="directory" id="resources">
        <div class="directory-head">
          <div>
            <p class="eyebrow"><span>01</span> RESOURCE INDEX</p>
            <h2>Latest drops <b id="result-count">05</b></h2>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.8"/></svg>
            <input id="resource-search" type="search" placeholder="SEARCH ARCHIVE" autocomplete="off">
          </label>
        </div>

        <div class="filters" role="group" aria-label="Filter archive">
          <button class="filter is-active" type="button" data-category="All" aria-pressed="true">All</button>
          <button class="filter" type="button" data-category="Libraries" aria-pressed="false">Libraries</button>
          <button class="filter" type="button" data-category="Frameworks" aria-pressed="false">Frameworks</button>
          <button class="filter" type="button" data-category="Gameplay" aria-pressed="false">Gameplay</button>
          <button class="filter" type="button" data-category="Appearance" aria-pressed="false">Appearance</button>
        </div>

        <div class="resource-grid" id="resource-grid"></div>
        <p class="no-results" id="no-results" hidden>No matching releases found.</p>
      </section>

      <footer class="page-footer">
        <span>OG5M RESOURCE ARCHIVE</span>
        <span>AUTHORIZED SOURCES <b>/</b> SECURE SUPPORT</span>
      </footer>
    </main>

    <dialog id="auth-dialog" class="modal">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div class="auth-tabs">
        <button class="auth-tab is-active" type="button" data-auth="login">Login</button>
        <button class="auth-tab" type="button" data-auth="register">Create account</button>
      </div>
      <form id="auth-form">
        <label class="field register-only" hidden><span>Display name</span><input name="name" autocomplete="name" minlength="2"></label>
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="primary-button" type="submit"><span>Enter archive</span><b>→</b></button>
      </form>
    </dialog>

    <dialog id="tickets-dialog" class="modal tickets-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div class="ticket-head">
        <div><p class="eyebrow"><span>///</span> SUPPORT CHANNEL</p><h2>Tickets</h2></div>
        <button class="small-button" id="new-ticket-button" type="button">New ticket</button>
      </div>
      <form id="ticket-form" hidden>
        <label class="field"><span>Subject</span><input name="subject" required minlength="3"></label>
        <label class="field"><span>Message</span><textarea name="message" required minlength="10" rows="4"></textarea></label>
        <p class="form-error" id="ticket-error" role="alert"></p>
        <button class="primary-button" type="submit"><span>Send ticket</span><b>→</b></button>
      </form>
      <div id="ticket-list" class="ticket-list"></div>
    </dialog>
  </body>
</html>
